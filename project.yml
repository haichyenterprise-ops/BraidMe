name: BraidMe
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.22.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
targets:
  BraidMe:
    type: application
    platform: iOS
    sources:
      - path: BraidMe
        excludes:
          - "Info.plist"
      - path: BraidMe/GoogleService-Info.plist
        buildPhase: resources
    entitlements:
      path: BraidMe/BraidMe.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: BraidMe/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "BraidMe uses your location to find braiders near you."
        NSPhotoLibraryUsageDescription: "BraidMe needs access to your photos to set your profile picture."
        NSCameraUsageDescription: "BraidMe uses your camera to take profile photos."
        NSApplePayMerchantID: "merchant.com.example.BraidMe"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.158058529601-34lkbg1ha528nv1e4vaamb4t9rfr0261
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.BraidMe
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BraidMe/Info.plist
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseDatabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
